[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision-models"
version = "0.1.0"
description = "Hierarchical branched-Qwen and BEV decision models on JEV-Bench"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers>=4.57,<4.58",
  "datasets",
  "numpy",
  "tqdm",
]

[project.optional-dependencies]
logging = ["wandb"]

[tool.setuptools.packages.find]
include = ["jevbench*"]
